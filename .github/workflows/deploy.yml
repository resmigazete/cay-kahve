name: Firebase'e yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Firebase web ayarını yaz
        env:
          WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          VAPID_KEY: ${{ vars.FIREBASE_VAPID_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = process.env.WEB_CONFIG || "";
            const k = raw.indexOf("apiKey");
            const a = k < 0 ? -1 : raw.lastIndexOf("{", k);
            const b = a < 0 ? -1 : raw.indexOf("}", a);
            if (a < 0 || b < a) { console.error("FIREBASE_WEB_CONFIG içinde apiKey içeren { ... } bloğu bulunamadı"); process.exit(1); }
            const body = raw.slice(a, b + 1);
            let cfg;
            try { cfg = new Function("return (" + body + ")")(); } catch (e) { console.error("FIREBASE_WEB_CONFIG okunamadı: " + e.message); process.exit(1); }
            for (const k of ["apiKey", "authDomain", "projectId", "appId"]) {
              if (!cfg[k]) { console.error("Eksik alan: " + k); process.exit(1); }
            }
            const out = "export const firebaseConfig = " + JSON.stringify(cfg, null, 2) + ";\n" +
              "export const VAPID_KEY = " + JSON.stringify((process.env.VAPID_KEY || "").trim()) + ";\n" +
              "export const ADMIN_EMAIL = " + JSON.stringify(process.env.ADMIN_EMAIL || "") + ";\n";
            fs.writeFileSync("public/js/firebase-config.js", out);
            console.log("Ayar yazıldı. projectId:", cfg.projectId);
          '
          node --input-type=module --check < public/js/firebase-config.js

      - name: Hosting'e yayınla
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live

      - name: Firestore kurallarını yayınla
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only firestore:rules --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"

      # Arka plan bildirimi için Cloud Function (Blaze planı gerekir). Başarısız olursa site yayını bozulmaz.
      - name: Bildirim fonksiyonunu yayınla
        continue-on-error: true
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PUSH_REGION: ${{ vars.FUNCTIONS_REGION }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx --yes firebase-tools@13 deploy --only functions --project "$PROJECT_ID" --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
